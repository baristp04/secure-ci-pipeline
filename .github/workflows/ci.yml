name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Job id is bound as a required status check in the main ruleset; do not rename.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
